[pytest]
# ====================================================================
# pytest 集中配置
# 不再需要在命令行重复指定冗长参数
# ====================================================================

# 测试目录
testpaths = test_apis

# Python 文件匹配
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers 注册（pytest 9.x 要求显式注册自定义 marker）
markers =
    p1: 优先级1 - 核心功能
    p2: 优先级2 - 次要功能
    smoke: 冒烟测试 - 每次 push 必跑
    regression: 回归测试 - PR/merge 时跑
    benchmark: 性能基准测试 - 仅 main 分支
    slow: 慢速测试
    e2e: 端到端测试

# 输出格式
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# 覆盖配置
# 提示: CI 中通过 --cov-fail-under=20 覆盖此值
# 本地开发不强制覆盖阈值，方便快速迭代
# 如需本地强制覆盖: pytest --cov=apps --cov-fail-under=20

# 忽略的目录
norecursedirs = .git .venv .pytest_cache __pycache__ node_modules frontend

# 最小版本要求
minversion = 8.0

# 超时（防止卡死）
# timeout = 120  # 需要 pytest-timeout 插件
